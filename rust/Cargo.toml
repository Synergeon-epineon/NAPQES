[package]
name = "napqes"
version = "0.1.0"
edition = "2021"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"
hkdf = "0.12"
pqcrypto-frodo = "0.4"
pqcrypto-traits = "0.3"

[dev-dependencies]
serde_json = "1"
dudect-bencher = "0.6"

[[bin]]
name = "napqes_demo"
path = "src/main.rs"

[[bin]]
name = "sts"
path = "src/bin/sts.rs"

[lib]
name = "napqes"
path = "src/lib.rs"
