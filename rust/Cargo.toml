[package]
name = "napqes"
version = "0.1.0"
edition = "2021"

# CVF-47 / CVF-V5-8: opt-in FIPS 140-3 self-test gating. When enabled, every
# public v8 and v7 encrypt/decrypt entry point, key generation
# (`generate_prime_numbers`, `generate_v8_key`, `NapqesKey::generate`) and
# every KEM encapsulate/decapsulate call first checks the POST latch and
# returns `Err(NotOperational)` unless `run_power_on_self_tests()` has
# succeeded. The error state is sticky until the process restarts. Not gated:
# `is_prime`, `validate_key`, `NapqesKey::new`, the KEM `keygen*` and
# `derive_napqes_key*` helpers, and `ot_frame` / `protocols` framing (which
# reach crypto only through gated entry points). Disabled by default so
# existing (non-FIPS) consumers see zero behaviour change.
[features]
default = []
fips_gate = []
# Test-only: exposes `self_test::fault_injection` so the FAILED state and the
# CRNG continuous-test failure can be exercised (rust/tests/fips_gate.rs).
# Refuses to compile in release mode.
fault_injection = []
# CVF-V5-4 / CVF-V5-7: the deprecated v7 encryptors (`encrypt`,
# `encrypt_bytes`, `encrypt_str`, `encrypt_raw`). Off by default: nothing in
# the crate encrypts with v7 any more; the v7 decryptors stay available for
# archived ciphertexts without this feature.
legacy-v7 = []
# Requires the unpublished rust/src/vale sources (gitignored).
vale = []
# Demo-only: MAX_NOISE_RUN 19 -> 9 (x10 tokens per codepoint instead of x20).
# Wire-incompatible with the default build and the Python/C KATs.
noise_x10 = []
# Benchmark-only: disable SHA-NI so HMAC-SHA256 runs in portable software.
soft_sha = ["sha2/force-soft"]
# Exposes a v8 re-tag hook so cargo-fuzz can reach post-authentication paths.
fuzzing = []

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"
hkdf = "0.12"
pqcrypto-frodo = "0.4"
pqcrypto-traits = "0.3"
# Classical half of the hybrid key establishment (ANSSI PQC doctrine).
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CVF-23: narrowed off "full" to only the tokio features actually reached
# from `kem_exchange.rs` and `bin/ls_gateway.rs` — macros (#[tokio::main],
# #[tokio::test]), rt-multi-thread (Runtime + tokio::spawn + JoinSet),
# net (TcpListener, lookup_host), io-util (AsyncReadExt/AsyncWriteExt),
# time (::time::sleep and friends), sync (default sync primitives). "full"
# additionally pulled in fs, process, signal, tracing, and parking-lot,
# none of which the AEAD or the OT gateway use.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
syslog = "6"
pqcrypto-sphincsplus = { version = "0.7.2", default-features = false, features = ["std"] }

[dev-dependencies]
dudect-bencher = "0.6"

# CVF-23: manifest hardening — release builds now trap on integer overflow
# (belt-and-braces backstop for CVF-16's checked_mul recommendation), and
# test builds keep debug_assert! live so CVF-12's ct_eq_bytes length check
# fires in `cargo test`.
[profile.release]
overflow-checks = true
debug-assertions = false

[profile.test]
overflow-checks = true

[[bin]]
name = "napqes_demo"
path = "src/main.rs"

[[bin]]
name = "sts"
path = "src/bin/sts.rs"

[[bin]]
name = "ls_gateway"
path = "src/bin/ls_gateway.rs"

[[bin]]
name = "vale_demo"
path = "src/bin/vale_demo.rs"
required-features = ["vale"]

[[test]]
name = "fips_gate"
path = "tests/fips_gate.rs"
required-features = ["fips_gate", "fault_injection"]

[[test]]
name = "fips_crng"
path = "tests/fips_crng.rs"
required-features = ["fips_gate", "fault_injection", "legacy-v7"]

[lib]
name = "napqes"
path = "src/lib.rs"
