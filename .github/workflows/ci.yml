name: NAPSEQ CI

on:
  push:
    branches: ["main", "dev", "phase-*"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  # CVF-V5-15: block commits that embed key material (prime tuples, sk).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── Static analysis ─────────────────────────────────────────────────
      - name: Ruff lint
        run: ruff check napqes.py main.py comparator.py tests/

      # ── Claim-traceability linter ────────────────────────────────────────
      - name: Claim linter (must exit 0)
        run: python tools/claim_lint.py docs/business/

      # ── KAT vector freshness check ───────────────────────────────────────
      - name: Verify KAT vectors match current implementation
        run: python tests/gen_kats.py --check

      # ── Full test suite ──────────────────────────────────────────────────
      - name: pytest
        run: pytest tests/ -v --tb=short

      # Python STS (nistrng 1.2.3) has upstream bugs that cause 8/15 tests to
      # be silently skipped; it is not used as a CI gate.  See tests/sts_report_v6.json
      # for the committed reference run and the rust-sts job for the live gate.

  rust-build:
    name: Rust build (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Cargo build
        working-directory: rust/
        run: cargo build --release

      # CVF-V5-2 / CVF-V5-4: the feature-gated surfaces must keep compiling.
      - name: Cargo build (experimental-stream, legacy-v7)
        working-directory: rust/
        run: cargo build --release --all-targets --features experimental-stream,legacy-v7

      # CVF-V5-6: the declared rust-version must keep building.
      - name: MSRV check (1.88)
        working-directory: rust/
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --all-targets

      - name: Cargo test (includes KAT stubs)
        working-directory: rust/
        run: cargo test --release -- --nocapture

      # CVF-V5-8: gate refusal + sticky error state (debug build: the
      # fault_injection feature refuses to compile in release mode).
      - name: FIPS gate refusal tests
        working-directory: rust/
        run: |
          cargo test --features fips_gate,fault_injection --test fips_gate
          cargo test --features fips_gate,fault_injection,legacy-v7 --test fips_gate --test fips_crng

      # ── STS gate (all 15 NIST SP 800-22 Rev 1a tests, no nistrng) ──────────
      # CVF-V5-5: INT-2 end to end — a signed binary starts, a modified one does not.
      - name: Software integrity (INT-2)
        working-directory: rust/
        run: |
          cargo build --release --features fips_integrity --bin napqes_demo --bin napqes_integrity
          ./target/release/napqes_integrity target/release/napqes_demo
          ./target/release/napqes_demo
          cp target/release/napqes_demo /tmp/tampered && cp target/release/napqes_demo.hmac /tmp/tampered.hmac
          printf '\x00' >> /tmp/tampered
          if /tmp/tampered; then echo 'tampered binary passed INT-2'; exit 1; fi

      - name: Run Rust STS (1M bits, exit 1 on any FAIL)
        working-directory: rust/
        run: cargo run --release --bin sts -- --bits 1000000 --out ../tests/sts_report_rust.json

      - name: Upload Rust STS report
        uses: actions/upload-artifact@v4
        with:
          name: sts-report-rust
          path: tests/sts_report_rust.json
          if-no-files-found: warn

  c-build:
    name: C build & KAT harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: C/
        run: make

      - name: Run KAT harness (full — must exit 0 with no FAILs)
        working-directory: C/
        run: make kat-test && ./kat-test ../tests/kat/v6_vectors.json

  cross-lang-roundtrip:
    name: Cross-language round-trip
    runs-on: ubuntu-latest
    needs: [lint-and-test, rust-build, c-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pytest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('rust/Cargo.toml') }}

      - name: Build C KAT harness
        working-directory: C/
        run: make kat-test

      - name: Run cross-language tests
        run: pytest tests/test_cross_lang.py -v --tb=short
